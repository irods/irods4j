name: irods4j-testing

services:
  irods-catalog:
    build:
      context: irods_catalog
    environment:
      - POSTGRES_PASSWORD=testpassword
    restart: always

  irods-catalog-provider:
    build:
      context: irods_catalog_provider_tls
    init: true
    ports:
      - "1247:1247"
    shm_size: 100mb
    volumes:
      - ./tls_certs:/tls_certs:ro
    healthcheck:
      # The file existence check guarantees that the iRODS server has completed
      # setup. This avoids issues with ils interacting with the server at the wrong time.
      # See the entrypoint script for details.
      test: ["CMD-SHELL", "su - irods -c '[ -f /tmp/irods_server_setup_complete.flag ] && ils || exit 1'"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s
      start_interval: 10s
    restart: always
    depends_on:
      - irods-catalog
